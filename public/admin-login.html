<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Access — Student Print System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --ink: #202522; --canvas: #f3f6f3; --lime: #d9f16a; }
    body { min-height: 100vh; display: grid; place-items: center; background: var(--canvas); color: var(--ink); font-family: "Segoe UI", Arial, sans-serif; }
    .login-shell { width: min(100% - 2rem, 420px); }
    .login-panel { background: #fff; border: 1px solid #dce2de; border-radius: 6px; padding: 2rem; }
    .brand { color: #176b4b; font-size: .8rem; font-weight: 700; }
  </style>
</head>
<body>
  <main class="login-shell">
    <div class="login-panel">
      <div class="brand mb-2">PRINTPOINT / OPERATIONS</div>
      <h1 class="h3 mb-1">Admin access</h1>
      <p class="text-secondary mb-4">Enter the administrator password to continue.</p>
      <form id="adminLoginForm">
        <label for="adminPassword" class="form-label">Password</label>
        <input id="adminPassword" class="form-control mb-3" type="password" autocomplete="current-password" required autofocus>
        <div id="loginError" class="alert alert-danger py-2 d-none" role="alert"></div>
        <button id="loginButton" class="btn btn-dark w-100" type="submit">Open admin panel</button>
      </form>
      <a href="/" class="d-inline-block mt-3 small">Return to PrintPoint</a>
    </div>
  </main>
  <script src="js/admin-login.js"></script>
</body>
</html>
