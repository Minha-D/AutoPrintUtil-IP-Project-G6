<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Documents — Student Print System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Student Print System</span>
      <div class="d-flex align-items-center">
        <span id="studentName" class="text-white me-3"></span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Log out</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title">Upload a PDF</h5>
        <div id="uploadError" class="alert alert-danger d-none"></div>
        <form id="uploadForm" class="row g-2 align-items-center">
          <div class="col-auto flex-grow-1">
            <input class="form-control" type="file" id="pdfFile" accept="application/pdf" required>
          </div>
          <div class="col-auto">
            <button type="submit" class="btn btn-primary">Upload</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">My Documents</h5>
        <table class="table align-middle">
          <thead>
            <tr>
              <th>File name</th>
              <th>Uploaded</th>
              <th>Print status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="docsTableBody">
            <!-- rows injected by JS -->
          </tbody>
        </table>
        <p id="noDocsMsg" class="text-muted d-none">No documents uploaded yet.</p>
      </div>
    </div>

    <div class="card shadow-sm mt-4">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center gap-2 mb-2">
          <h5 class="card-title mb-0">Payment history</h5>
          <span id="paymentHistoryCount" class="small text-muted"></span>
        </div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead><tr><th>Date</th><th>Document</th><th>Receipt</th><th>Payment</th><th>Print</th></tr></thead>
            <tbody id="paymentHistoryBody"><tr><td colspan="5" class="text-muted">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Print options modal -->
  <div class="modal fade" id="printModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Print Document</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="printStatus" class="alert alert-info d-none" role="status" aria-live="polite">
            <span id="printStatusSpinner" class="spinner-border spinner-border-sm me-2 d-none" aria-hidden="true"></span>
            <span id="printStatusMessage"></span>
          </div>
          <p class="mb-3">Printing: <strong id="printFileName"></strong></p>
          <div class="mb-3">
            <label for="copiesInput" class="form-label">Number of copies</label>
            <input type="number" class="form-control" id="copiesInput" min="1" max="100" value="1">
          </div>
          <div class="mb-3">
            <label class="form-label d-block">Color mode</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="colorMode" id="colorOption" value="color" checked>
              <label class="form-check-label" for="colorOption">Color</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="colorMode" id="bwOption" value="bw">
              <label class="form-check-label" for="bwOption">Black &amp; White</label>
            </div>
          </div>
          <div class="border rounded p-3 mb-3" aria-live="polite">
            <div class="fw-semibold mb-2">Print receipt</div>
            <div class="d-flex justify-content-between small py-1"><span>PDF pages</span><span id="receiptPages">—</span></div>
            <div class="d-flex justify-content-between small py-1"><span>Copies</span><span id="receiptCopies">1</span></div>
            <div class="d-flex justify-content-between small py-1"><span>Mode and rate</span><span id="receiptRate">—</span></div>
            <div class="d-flex justify-content-between border-top mt-2 pt-2 fw-bold"><span>Total</span><span id="receiptTotal">—</span></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" id="confirmPrintBtn" class="btn btn-primary">I've paid · Request approval</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Preview modal -->
  <div class="modal fade" id="previewModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="previewFileName"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-0" style="height: 75vh;">
          <embed id="previewEmbed" src="" type="application/pdf" width="100%" height="100%">
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/documents.js"></script>
</body>
</html>
